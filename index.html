<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Counter</title>
</head>
<body style="text-align:center; font-family:Arial; margin-top:50px;">

    <h1>🚶 Step Counter</h1>
    <h2>Steps: <span id="stepDisplay">0</span></h2>

    <button onclick="start()">Start Tracking</button>

    <script>
        let steps = 0;
        let lastMovement = 0;
        let threshold = 3;   // 🔥 MUCH LOWER = better detection
        let canStep = true;

        function start() {

            alert("Sensor started! Move your phone.");

            // iPhone permission (safe for Android too)
            if (typeof DeviceMotionEvent !== "undefined" &&
                typeof DeviceMotionEvent.requestPermission === "function") {

                DeviceMotionEvent.requestPermission()
                .then(response => {
                    if (response === "granted") {
                        initSensor();
                    } else {
                        alert("Permission denied");
                    }
                })
                .catch(console.error);

            } else {
                // Android
                initSensor();
            }
        }

        function initSensor() {

            window.addEventListener("devicemotion", function(event) {

                let acc = event.accelerationIncludingGravity;
                if (!acc) return;

                let x = acc.x || 0;
                let y = acc.y || 0;
                let z = acc.z || 0;

                let movement = Math.sqrt(x*x + y*y + z*z);

                let diff = Math.abs(movement - lastMovement);

                // Detect step
                if (diff > threshold && canStep) {
                    steps++;
                    document.getElementById("stepDisplay").innerText = steps;

                    canStep = false;

                    setTimeout(() => {
                        canStep = true;
                    }, 300);
                }

                lastMovement = movement;
            });
        }
    </script>

</body>
</html>
