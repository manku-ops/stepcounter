
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>🚶 Step Counter</h1>

    <div class="stat" id="steps">0</div>
    <div class="label">Steps</div>

    <div class="stat" id="distance">0 m</div>
    <div class="label">Distance</div>

    <div class="stat" id="calories">0 kcal</div>
    <div class="label">Calories Burned</div>

    <button class="start-btn" onclick="start()">Start Tracking</button>
    <button class="reset-btn" onclick="reset()">Reset</button>
</div>

<script src="script.js"></script>

</body>
</html>
